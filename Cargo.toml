[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.8"
bincode = "1.3"
anyhow = "1"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }

# Bevy is slow in unoptimized dev builds; keep our code fast to compile
# but optimize all dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
